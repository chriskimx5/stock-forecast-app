[tool.poetry]
name = "stock-forecasting-backend"
version = "0.1.0"
description = "FastAPI backend for stock forecasting webapp"
authors = ["Chris Kim"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"

sqlalchemy = "^2.0.0"
psycopg = { extras = ["binary"], version = "^3.2.0" }
alembic = "^1.13.0"

redis = "^5.2.0"

pandas = "^2.2.0"
numpy = "^2.1.0"
yfinance = "^0.2.0"
scikit-learn = "^1.5.0"
joblib = "^1.4.0"

httpx = "^0.27.0"
apscheduler = "^3.10.0"
python-dotenv = "^1.2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.6.0"
mypy = "^1.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
